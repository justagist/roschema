[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roschema"
version = "0.1.2"
description = "Breaking-change detection, linting and formatting for ROS 2 interface definitions"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Saif Sidhik", email = "saif.sidhik@helloleap.ai" }]
keywords = ["ros2", "ros", "interface", "msg", "srv", "action", "breaking-change", "lint"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
bag = ["mcap>=1.1"]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
    "mypy>=1.10",
    "tomli>=2.0",  # so mypy (targeting 3.10) resolves the tomllib fallback import
]

[project.scripts]
roschema = "roschema.cli:app"

[project.urls]
Homepage = "https://github.com/justagist/roschema"
Documentation = "https://github.com/justagist/roschema#readme"
Repository = "https://github.com/justagist/roschema"
Issues = "https://github.com/justagist/roschema/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/roschema"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
