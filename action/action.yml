name: roschema
description: Catch breaking ROS 2 interface changes in the pull request.
branding:
  icon: git-pull-request
  color: purple

inputs:
  target:
    description: Path or package to check.
    default: "."
  against:
    description: Baseline -- a git ref, directory, .mcap bag or roschema.lock.
    default: origin/main
  level:
    description: >-
      Reporting level (wire, source, introspection, behavior). Empty uses the
      level configured in roschema.toml, else source.
    default: ""
  format:
    description: Output format (text, json, github).
    default: github
  deep:
    description: Resolve nested types and report transitive breakage (RS110).
    default: "false"
  allow-empty:
    description: >-
      Pass when the baseline has no interfaces, e.g. on the pull request that
      adds the first ones. Otherwise an empty baseline fails the step.
    default: "false"
  warnings-as-errors:
    description: Fail the step on warnings as well as errors.
    default: "false"
  exclude:
    description: >-
      Whitespace-separated globs of packages/interfaces to skip. Split on
      whitespace only so patterns reach roschema literally.
    default: ""
  version:
    description: >-
      roschema requirement for uvx. Unpinned runs the latest release (refreshed
      on every run, even with a uv cache); pin it (e.g. "roschema==0.5.0") for
      reproducible results.
    default: roschema

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v10.3.3
      with:
        # Nothing to key a cache on in the caller's repo, and uvx refreshes
        # roschema on every run anyway.
        enable-cache: false
    - shell: bash
      env:
        ROSCHEMA_TARGET: ${{ inputs.target }}
        ROSCHEMA_AGAINST: ${{ inputs.against }}
        ROSCHEMA_LEVEL: ${{ inputs.level }}
        ROSCHEMA_FORMAT: ${{ inputs.format }}
        ROSCHEMA_DEEP: ${{ inputs.deep }}
        ROSCHEMA_ALLOW_EMPTY: ${{ inputs.allow-empty }}
        ROSCHEMA_WARNINGS_AS_ERRORS: ${{ inputs.warnings-as-errors }}
        ROSCHEMA_EXCLUDE: ${{ inputs.exclude }}
        ROSCHEMA_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        args=(check "$ROSCHEMA_TARGET"
              --against "$ROSCHEMA_AGAINST"
              --format "$ROSCHEMA_FORMAT")
        if [ -n "$ROSCHEMA_LEVEL" ]; then
          args+=(--level "$ROSCHEMA_LEVEL")
        fi
        if [ "$ROSCHEMA_DEEP" = "true" ]; then
          args+=(--deep)
        fi
        if [ "$ROSCHEMA_ALLOW_EMPTY" = "true" ]; then
          args+=(--allow-empty)
        fi
        if [ "$ROSCHEMA_WARNINGS_AS_ERRORS" = "true" ]; then
          args+=(--warnings-as-errors)
        fi
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          args+=(--summary "$GITHUB_STEP_SUMMARY")
        fi
        read -r -a excludes <<< "${ROSCHEMA_EXCLUDE//$'\n'/ }"
        for glob in "${excludes[@]}"; do
          args+=(--exclude "$glob")
        done
        uvx --refresh-package roschema --from "$ROSCHEMA_VERSION" roschema "${args[@]}"
